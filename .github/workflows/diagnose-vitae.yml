name: Diagnose Vitae read path
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Read character response structure on the running server
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          DIAGNOSTIC_CODE=$(base64 -w0 tools/diagnose_vitae.py)
          flyctl ssh console -a world-of-darkness-bot -C "python -c 'import base64;exec(base64.b64decode(\"$DIAGNOSTIC_CODE\"))'"
