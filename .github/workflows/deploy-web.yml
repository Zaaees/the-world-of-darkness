name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main, master, claude/init-project-setup-9CZ8o]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
      - 'data/blood_actions.json'
      - 'data/ghoul_disciplines.json'
      - 'data/site_content.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # Pinning ubuntu-22.04 to resolve 'Internal Server Error' / 'Job not acquired' issues with ubuntu-latest
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # git show needs the parent to distinguish changed files from the whole tree.
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Vampire regression tests
        run: npm run test:vampire
        working-directory: web

      - name: Vampire lint
        run: npm run lint:vampire
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web
        env:
          VITE_API_URL: https://world-of-darkness-bot.fly.dev

      - name: Wait for the matching bot deployment when backend files changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git show --pretty=format: --name-only "$GITHUB_SHA" | grep -Eq '(^[^/]+\.py$|^(cogs|data|utils|views|modules)/|^(requirements.txt|Dockerfile|fly.toml)$)'; then
            exit 0
          fi
          for attempt in $(seq 1 60); do
            RESULT=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-bot.yml --commit "$GITHUB_SHA" --json status,conclusion --jq '.[0] | if .status == "completed" then .conclusion else "pending" end')
            if [ "$RESULT" = success ]; then exit 0; fi
            if [ "$RESULT" != pending ] && [ -n "$RESULT" ]; then
              echo "Bot deployment failed; website publication stopped."
              exit 1
            fi
            sleep 10
          done
          echo "Bot deployment not confirmed; website publication stopped."
          exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Pinning ubuntu-22.04 to resolve 'Internal Server Error' / 'Job not acquired' issues with ubuntu-latest
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
