name: Deploy Bot to Fly.io

on:
  push:
    branches: [main, master, claude/init-project-setup-9CZ8o]
    paths:
      - '*.py'
      - 'cogs/**'
      - 'data/**'
      - 'utils/**'
      - 'views/**'
      - 'modules/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'fly.toml'
  workflow_dispatch:

jobs:
  deploy:
    # Pinning ubuntu-22.04 to resolve 'Internal Server Error' / 'Job not acquired' issues with ubuntu-latest
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Vampire backend before deployment
        run: |
          pip install -r requirements.txt pytest pytest-asyncio
          python -m pytest tests/test_blood_catalog.py tests/test_vampire_readiness.py tests/test_site_content.py

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Verify Sheets authentication and back up the persistent database
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          PREFLIGHT_CODE=$(base64 -w0 tools/preflight_vampire_deploy.py)
          flyctl ssh console -a world-of-darkness-bot -C "python -c 'import base64;exec(base64.b64decode(\"$PREFLIGHT_CODE\"))'"

      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
